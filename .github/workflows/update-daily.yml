name: Update Rudy Daily

on:
  schedule:
    # 08:00 Beijing time every day.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

       - name: Update daily issue
            run: node scripts/update-daily.js

      - name: Build check
        run: npm run build

      - name: Commit updated issue
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily issue"
          file_pattern: data/daily.json
